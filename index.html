<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <title>Plasma Workspace</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100svh;
      display: grid;
      grid-template-rows: 1fr auto;
      padding: 24px 38px 32px;
      background: #000000;
      color: #ccba8a;
      font-family: "Poppins", sans-serif;
      font-weight: 300;
      text-align: center;
    }

    main {
      width: min(100%, 720px);
      place-self: center;
      padding: 56px 0;
    }

    h1 {
      margin: 0 0 16px;
      font-size: clamp(2rem, 6vw, 4rem);
      font-weight: 600;
      line-height: 1.1;
    }

    p {
      margin: 0 auto;
      max-width: 620px;
      font-size: clamp(1rem, 2.2vw, 1.25rem);
      font-weight: 400;
      line-height: 1.7;
    }

    a {
      color: inherit;
      font-weight: 600;
      text-decoration-thickness: 1px;
      text-underline-offset: 4px;
    }

    a:hover,
    a:focus-visible {
      opacity: 0.72;
    }

    .site-footer {
      width: min(100%, 1040px);
      margin-inline: auto;
      color: #ffffff;
    }

    .footer-line {
      height: 1px;
      margin: 0 0 38px;
      border: 0;
      background: rgba(204, 186, 138, 0.28);
    }

    .footer-main {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 32px;
    }

    .copyright {
      justify-self: start;
      margin: 0;
      font-size: 0.72rem;
      font-weight: 400;
    }

    .copyright-mark {
      color: #ccba8a;
    }

    .footer-logo {
      width: 130px;
    }

    .footer-links {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 26px;
    }

    .footer-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #ffffff;
      font-size: 0.72rem;
      font-weight: 400;
      text-decoration: none;
      text-transform: uppercase;
    }

    .footer-link svg {
      width: 17px;
      height: 17px;
      flex: 0 0 auto;
      color: #ccba8a;
    }

    .made-by {
      margin: 48px 0 0;
      color: rgba(255, 255, 255, 0.72);
      font-size: 0.68rem;
      font-weight: 300;
    }

    .astrea-link {
      color: #ccba8a;
      font-weight: 500;
      text-decoration: none;
    }

    @media (max-width: 720px) {
      body {
        padding-inline: 24px;
      }

      .footer-main {
        grid-template-columns: 1fr;
        justify-items: center;
      }

      .footer-logo {
        grid-row: 1;
      }

      .footer-links {
        grid-row: 2;
        justify-content: center;
        flex-wrap: wrap;
      }

      .copyright {
        grid-row: 3;
        justify-self: center;
      }
    }

    @media (max-width: 430px) {
      body {
        padding: 18px 18px 28px;
      }

      main {
        padding-block: 48px;
      }

      .footer-links {
        flex-direction: column;
        gap: 14px;
      }

      .made-by {
        margin-top: 38px;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>¡Llegaste muy temprano!</h1>
    <p>
      Todavía estamos trabajando en esto, pero por mientras podés sumarte a la comunidad de
      <a href="https://www.instagram.com/plasma.ws" target="_blank" rel="noopener noreferrer">plasma workspace</a> ;)
    </p>
  </main>

  <footer class="site-footer">
    <hr class="footer-line">

    <div class="footer-main">
      <p class="copyright">PLASMA <span class="copyright-mark">©</span> 2026</p>

      <img class="footer-logo" src="assets/logo-plasma.png" alt="Plasma Workspace">

      <div class="footer-links">
        <a class="footer-link" href="https://wa.me/595994151453" target="_blank" rel="noopener noreferrer" aria-label="Contactar a Plasma por WhatsApp">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <path d="M20 11.5a8 8 0 0 1-11.8 7L4 20l1.5-4A8 8 0 1 1 20 11.5Z"/>
            <path d="M9 8.5c.3 2 2 3.8 4 4.3l1-1c.2-.2.5-.3.8-.1l2 1c.3.2.4.5.3.8-.4 1.2-1.5 2-2.8 2-3.4-.2-6.4-3.1-6.7-6.5 0-1.2.7-2.3 1.8-2.8.3-.1.7 0 .8.3l.9 2c.1.3 0 .6-.2.8Z"/>
          </svg>
          <span>+595 994 151 453</span>
        </a>

        <a class="footer-link" href="https://www.instagram.com/plasma.ws/" target="_blank" rel="noopener noreferrer" aria-label="Visitar Plasma Workspace en Instagram">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <rect x="3" y="3" width="18" height="18" rx="5"/>
            <circle cx="12" cy="12" r="4"/>
            <circle cx="17.4" cy="6.6" r="1" fill="currentColor" stroke="none"/>
          </svg>
          <span>plasma.ws</span>
        </a>
      </div>
    </div>

    <p class="made-by">
      This site was made with all the love of the world
      <a class="astrea-link" href="https://www.instagram.com/astrea.ndive/" target="_blank" rel="noopener noreferrer">by ASTREA™</a>
    </p>
  </footer>
</body>
</html>
